name: Deploy piterfly Pages (manual)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to serve byte-for-byte
        required: true
        default: '1.0.1'
        type: string

permissions:
  contents: read

concurrency:
  group: piterfly-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PITERFLY_RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
      - name: Verify reviewed site sources
        run: |
          python tools/check_public_export.py
          python tests/public_export_test.py
          python tests/site_test.py
      - name: Download the published release without recompiling firmware
        run: |
          [[ "$PITERFLY_RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$PITERFLY_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          gh release download "$PITERFLY_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir build/releases/pages
          cd build/releases/pages
          sha256sum --check SHA256SUMS
      - name: Generate and verify the public site from the exact release assets
        run: |
          PITERFLY_VERSION=$(python -c 'import json; print(json.load(open("build/releases/pages/BUILD_INFO.json"))["version"])')
          test "$PITERFLY_VERSION" = "$PITERFLY_RELEASE_TAG"
          python web/make_site.py "build/releases/pages/piterfly-$PITERFLY_VERSION.fwsc" "$PITERFLY_VERSION" build/site --release-dir build/releases/pages
          python tools/check_pages_site.py build/site build/releases/pages
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy the generated site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
